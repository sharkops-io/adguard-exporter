---
rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  # --- AdGuardDown ---------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'adguard_running{server="dns2"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: AdGuardDown
        exp_alerts:
          - exp_labels:
              severity: critical
              server: dns2
            exp_annotations:
              summary: "AdGuard dns2 reports itself stopped"
              description: "DNS resolution for clients using dns2 is failing."

  # A running instance must NOT page.
  - interval: 1m
    input_series:
      - series: 'adguard_running{server="dns2"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: AdGuardDown
        exp_alerts: []

  # --- AdGuardProtectionDisabled --------------------------------------------
  - interval: 1m
    input_series:
      - series: 'adguard_protection_enabled{server="dns1"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: AdGuardProtectionDisabled
        exp_alerts:
          - exp_labels:
              severity: warning
              server: dns1
            exp_annotations:
              summary: "AdGuard dns1 has filtering disabled"
              description: "Ad and tracker blocking is off on dns1. This is usually a temporary pause left on by accident."

  # Protection enabled must NOT page.
  - interval: 1m
    input_series:
      - series: 'adguard_protection_enabled{server="dns1"}'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: AdGuardProtectionDisabled
        exp_alerts: []

  # --- AdGuardCollectorFailing -----------------------------------------------
  - interval: 1m
    input_series:
      - series: 'adguard_scrape_collector_success{server="dns2"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: AdGuardCollectorFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              server: dns2
            exp_annotations:
              summary: "AdGuard dns2 is not collecting"
              description: "The exporter is up but cannot read dns2. Check credentials and reachability."

  # A healthy collector must NOT page.
  - interval: 1m
    input_series:
      - series: 'adguard_scrape_collector_success{server="dns2"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: AdGuardCollectorFailing
        exp_alerts: []

  # --- AdGuardExporterDown ---------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'up{job="adguard-exporter",instance="adguard-exporter:9618"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: AdGuardExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: adguard-exporter
              instance: adguard-exporter:9618
            exp_annotations:
              summary: "AdGuard exporter is down"
              description: "Prometheus cannot scrape adguard-exporter. House DNS metrics are blind."

  # A scrapeable target must NOT page.
  - interval: 1m
    input_series:
      - series: 'up{job="adguard-exporter",instance="adguard-exporter:9618"}'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: AdGuardExporterDown
        exp_alerts: []

  # --- AdGuardStatsWindowUnexpected ------------------------------------------
  # A healthy window must NOT fire, which is what catches an inverted comparison.
  - interval: 1m
    input_series:
      - series: 'adguard_stats_window_seconds{server="dns2"}'
        values: '86400+0x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: AdGuardStatsWindowUnexpected
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'adguard_stats_window_seconds{server="dns2"}'
        values: '604800+0x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: AdGuardStatsWindowUnexpected
        exp_alerts:
          - exp_labels:
              severity: warning
              server: dns2
            exp_annotations:
              summary: "AdGuard dns2 statistics window is not 24h"
              description: "Window is 604800s. The _24h and _last_hour metric names no longer describe what they carry."

  # --- AdGuardSlowProcessing --------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'adguard_avg_processing_time_seconds{server="dns2"}'
        values: '0.15+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: AdGuardSlowProcessing
        exp_alerts:
          - exp_labels:
              severity: warning
              server: dns2
            exp_annotations:
              summary: "AdGuard dns2 is resolving slowly"
              description: "Mean processing time is 150ms, against a ~17ms baseline."

  # Baseline latency must not page.
  - interval: 1m
    input_series:
      - series: 'adguard_avg_processing_time_seconds{server="dns2"}'
        values: '0.018+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AdGuardSlowProcessing
        exp_alerts: []
